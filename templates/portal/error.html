{% extends "portal/base.html" %}

{% block title %}Error {{ code }} — CampusConnect{% endblock %}

{% block content %}
<div class="portal-container text-center py-5">
    <div class="portal-card mx-auto" style="max-width: 500px; padding: 40px 20px;">
        <span style="font-size: 3rem;">⚠️</span>
        <h2 class="mt-2">{{ code }} — Page Error</h2>
        <p class="text-muted">{{ message }}</p>
        <div class="mt-4">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Student Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
